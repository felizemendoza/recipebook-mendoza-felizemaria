{% extends "base.html" %}

{% block content %}
    <h3>{{ recipe.name }}</h3>
    <h4>By {{ recipe.author }}</h4>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
            <li>
                {{ ingredient.quantity }} {{ ingredient.ingredient.name }}
            </li>
        {% endfor %}
    </ul>
{% endblock %}
