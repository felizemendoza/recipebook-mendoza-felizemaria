{% extends "base.html" %}

{% block heading %}Recipe List{% endblock %}
{% block content %}
    <ul>
        {% for recipe in recipe_list %}
            <li>
                <a href = "{{ recipe.get_absolute_url }}">
                    {{ recipe.name }}
                </a>
            </li>
        {% endfor %}
    </ul>
    <a href = "{% url 'ledger:recipe_create' %}">Add New Recipe</a>
{% endblock %}
